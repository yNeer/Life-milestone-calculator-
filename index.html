<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#4f46e5" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="description" content="Calculate your life milestones in days, hours, and seconds. Discover mathematical curiosities about your age.">
    <title>Life Milestones Calculator</title>
    <!-- Relative path for manifest is critical for sub-path deployments -->
    <link rel="manifest" href="./manifest.json">
    
    <!-- Capture Install Prompt Immediately -->
    <script>
      window.pwaInstallPrompt = null;
      window.addEventListener('beforeinstallprompt', (e) => {
        // Prevent the mini-infobar from appearing on mobile
        e.preventDefault();
        // Stash the event so it can be triggered later.
        window.pwaInstallPrompt = e;
        console.log('PWA Install Prompt captured globally');
      });
    </script>

    <!-- Using Tailwind CDN for simplicity as per original design, though installing it via PostCSS is recommended for production -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: 'media', 
        theme: {
          extend: {
            colors: {
              skin: {
                base: 'rgb(var(--color-base) / <alpha-value>)',
                card: 'rgb(var(--color-card) / <alpha-value>)',
                text: 'rgb(var(--color-text) / <alpha-value>)',
                muted: 'rgb(var(--color-muted) / <alpha-value>)',
                primary: 'rgb(var(--color-primary) / <alpha-value>)',
                border: 'rgb(var(--color-border) / <alpha-value>)',
                input: 'rgb(var(--color-input) / <alpha-value>)',
              }
            },
            animation: {
              'blob': 'blob 10s infinite',
              'float': 'float 6s ease-in-out infinite',
            },
            keyframes: {
              blob: {
                '0%': { transform: 'translate(0px, 0px) scale(1)' },
                '33%': { transform: 'translate(30px, -50px) scale(1.1)' },
                '66%': { transform: 'translate(-20px, 20px) scale(0.9)' },
                '100%': { transform: 'translate(0px, 0px) scale(1)' },
              },
              float: {
                '0%, 100%': { transform: 'translateY(0)' },
                '50%': { transform: 'translateY(-10px)' },
              }
            }
          }
        }
      }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
      :root {
        /* Default to Light Theme RGBs */
        --color-base: 240 244 248;
        --color-card: 255 255 255;
        --color-text: 15 23 42;
        --color-muted: 100 116 139;
        --color-primary: 79 70 229;
        --color-border: 255 255 255;
        --color-input: 241 245 249;
      }
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
        background-color: rgb(var(--color-base));
        color: rgb(var(--color-text));
        transition: background-color 0.5s ease, color 0.5s ease;
        overscroll-behavior-y: none;
        
        /* Deep Mesh Gradient for Glass Effect */
        background-image: 
            radial-gradient(at 0% 0%, rgba(var(--color-primary), 0.25) 0px, transparent 50%),
            radial-gradient(at 100% 0%, rgba(236, 72, 153, 0.2) 0px, transparent 50%),
            radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.2) 0px, transparent 50%),
            radial-gradient(at 0% 100%, rgba(139, 92, 246, 0.2) 0px, transparent 50%);
        background-attachment: fixed;
        background-size: cover;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      
      /* Hide Scrollbar for cleaner UI */
      ::-webkit-scrollbar {
        width: 0px;
        background: transparent;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "date-fns": "https://esm.sh/date-fns@^4.1.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0",
    "jspdf": "https://esm.sh/jspdf@^4.0.0",
    "vite": "https://esm.sh/vite@^7.3.0",
    "@vitejs/plugin-react": "https://esm.sh/@vitejs/plugin-react@^5.1.2",
    "html-to-image": "https://esm.sh/html-to-image@^1.11.13"
  }
}
</script>
</head>
  <body>
    <div id="root">
      <div class="min-h-screen text-skin-text transition-colors duration-300">
        <!-- Skeleton Top Nav -->
        <div class="sticky top-0 z-40 bg-skin-base/80 backdrop-blur-lg border-b border-skin-border/50 px-4 py-3 flex justify-between items-center h-14">
          <div class="flex items-center gap-3 animate-pulse">
            <div class="w-8 h-8 rounded-xl bg-skin-card/40"></div>
            <div class="w-32 h-6 rounded bg-skin-card/40 hidden sm:block"></div>
          </div>
          <div class="flex items-center gap-2 animate-pulse">
             <div class="w-8 h-8 rounded-full bg-skin-card/40"></div>
          </div>
        </div>

        <!-- Skeleton Main Content -->
        <div class="max-w-6xl mx-auto px-4 sm:px-6 py-6 pb-32">
          <div class="flex flex-col gap-5 animate-pulse">

            <!-- Skeleton Header -->
            <div class="flex items-center justify-between px-2 mb-2">
               <div>
                  <div class="h-6 w-48 bg-skin-card/60 rounded mb-2"></div>
                  <div class="h-4 w-32 bg-skin-card/40 rounded"></div>
               </div>
               <div class="w-10 h-10 rounded-full bg-skin-card/50"></div>
            </div>

            <!-- Skeleton Grid -->
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 auto-rows-auto">
                <div class="col-span-2 lg:col-span-2 row-span-2 bg-skin-card/40 rounded-[2rem] h-[300px]"></div>
                <div class="col-span-2 lg:col-span-2 row-span-2 bg-skin-card/40 rounded-[2rem] h-[300px]"></div>
                <div class="col-span-1 lg:col-span-1 min-h-[140px] bg-skin-card/40 rounded-[2rem]"></div>
                <div class="col-span-1 lg:col-span-1 min-h-[140px] bg-skin-card/40 rounded-[2rem]"></div>
                <div class="col-span-2 lg:col-span-1 min-h-[200px] bg-skin-card/40 rounded-[2rem]"></div>
                <div class="col-span-1 lg:col-span-1 min-h-[140px] bg-skin-card/40 rounded-[2rem]"></div>
                <div class="col-span-1 lg:col-span-1 min-h-[140px] bg-skin-card/40 rounded-[2rem]"></div>
            </div>
          </div>
        </div>

        <!-- Skeleton Bottom Nav -->
        <div class="fixed bottom-6 left-0 right-0 z-50 flex justify-center pointer-events-none px-4">
          <div class="bg-skin-card/80 backdrop-blur-2xl border border-white/20 shadow-2xl rounded-full px-2 py-2 flex items-center gap-1 sm:gap-2 max-w-md w-full justify-between sm:justify-center h-16 animate-pulse">
             <div class="flex-1 sm:flex-none w-12 h-12 rounded-full bg-skin-card/40"></div>
             <div class="flex-1 sm:flex-none w-12 h-12 rounded-full bg-skin-card/40"></div>
             <div class="flex-1 sm:flex-none w-12 h-12 rounded-full bg-skin-card/40"></div>
             <div class="flex-1 sm:flex-none w-12 h-12 rounded-full bg-skin-card/40"></div>
          </div>
        </div>
      </div>
    </div>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          // Use relative path for SW registration to support nested deployments
          navigator.serviceWorker.register('./sw.js').then(registration => {
            console.log('SW registered: ', registration);
          }).catch(registrationError => {
            console.log('SW registration failed: ', registrationError);
          });
        });
      }
    </script>
    <script type="module" src="./index.tsx"></script>
  </body>
</html>
